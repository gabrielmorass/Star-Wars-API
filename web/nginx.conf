# Usa o worker padrão da imagem oficial para atender conexões HTTP.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mantém URLs desconhecidas dentro da aplicação, permitindo o roteamento do front.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve o serviço api pelo DNS interno do Docker em cada requisição.
    # A variável no proxy_pass adia a resolução, então o Nginx inicia mesmo sem a API.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;

        # Encaminha a identidade do cliente e o protocolo recebido ao BFF.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evita conexões e respostas penduradas quando o serviço não responde.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Mantém assets em cache por pouco tempo para reduzir pedidos sem atrasar atualizações.
    location ~* \.(?:css|js|svg|json|ico|png|jpe?g|webp|woff2?)$ {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Comprime respostas textuais para reduzir o tráfego do front estático.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
